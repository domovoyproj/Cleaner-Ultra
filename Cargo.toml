[package]
name = "photosort"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry"]

[dependencies]
anyhow = "1"
chrono = "0.4"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "ico"] }
kamadak-exif = "0.6"
parking_lot = "0.12"
rayon = "1.11"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
tao = { version = "0.34", optional = true }
wry = { version = "0.57", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
